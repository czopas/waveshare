; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare_32108]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.psram_type = opi
lib_ldf_mode = deep+
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-I"C:/Users/czopa/.platformio/packages/framework-arduinoespressif32/libraries/Network/src"
	-I"C:/Users/czopa/.platformio/packages/framework-arduinoespressif32/libraries/FS/src"
	-I"C:/Users/czopa/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src"
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	knolleary/PubSubClient@^2.8
	arduino-libraries/NTPClient@^3.2.1
	emelianov/modbus-esp8266@^4.1.0
